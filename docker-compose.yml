services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: schoolms
      POSTGRES_USER: schoolms_user
      POSTGRES_PASSWORD: StrongPass123!
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U schoolms_user -d schoolms" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: ../docker/api.Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=db;Database=schoolms;Username=schoolms_user;Password=StrongPass123!
      - Redis__Connection=redis:6379
      - Jwt__Secret=CHANGE_THIS_TO_A_64_CHAR_SECRET_KEY_IN_PROD!!CHANGE_THIS_TO_A_64
      - Jwt__Issuer=SchoolMS
      - Jwt__Audience=SchoolMS
      - Jwt__ExpiryMinutes=60
      - FileStorage__BasePath=/app/uploads
      - FileStorage__BaseUrl=http://localhost:5000/uploads
      - Cors__AllowedOrigins__0=http://localhost:3000
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads: