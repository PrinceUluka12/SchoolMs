name: Deploy to Staging

on:
  push:
    branches: [ develop ]

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: schoolms-api-staging
  AZURE_WEBAPP_PACKAGE_PATH: ./publish

jobs:
  deploy-api-staging:
    name: Deploy API to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Build
        run: |
          dotnet restore backend/SchoolMS.sln
          dotnet publish backend/SchoolMS.Api/SchoolMS.Api.csproj \
            --configuration Release \
            --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy to Azure App Service (Staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: staging
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Health check
        run: |
          sleep 30
          curl --fail https://schoolms-api-staging.azurewebsites.net/health/ready \
            || (echo "Health check failed" && exit 1)

  deploy-frontend-staging:
    name: Deploy Frontend to Staging (SWA)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_API_URL: "https://schoolms-api-staging.azurewebsites.net/api/v1"

      - name: Deploy to Azure Static Web Apps (Staging)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN_STAGING }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true