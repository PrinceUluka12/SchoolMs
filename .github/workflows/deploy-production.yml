name: Deploy to Production

on:
  push:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: schoolms-api
  AZURE_WEBAPP_PACKAGE_PATH: ./publish

jobs:
  # Require manual approval before deploying to production
  approval:
    name: Await Production Approval
    runs-on: ubuntu-latest
    environment: production   # GitHub environment with required reviewers set
    steps:
      - name: Production deployment approved
        run: echo "Production deployment approved by ${{ github.actor }}"

  deploy-api-production:
    name: Deploy API to Production
    runs-on: ubuntu-latest
    needs: approval
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore & Build
        run: |
          dotnet restore backend/SchoolMS.sln
          dotnet publish backend/SchoolMS.Api/SchoolMS.Api.csproj \
            --configuration Release \
            --output ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Deploy to Azure App Service (Production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

      - name: Production health check
        run: |
          sleep 45
          curl --fail https://api.schoolms.com/health/ready \
            || (echo "Production health check failed — rollback required" && exit 1)

      - name: Notify on success
        if: success()
        run: echo "::notice::Production deployment successful — $(date -u)"

      - name: Notify on failure
        if: failure()
        run: echo "::error::Production deployment FAILED — investigate immediately"

  deploy-frontend-production:
    name: Deploy Frontend to Production (SWA)
    runs-on: ubuntu-latest
    needs: approval
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_API_URL: "https://api.schoolms.com/api/v1"

      - name: Deploy to Azure Static Web Apps (Production)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN_PRODUCTION }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true